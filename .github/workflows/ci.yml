# Build + test + format validation on the three target platforms.
# Validation here means validator tools only; it is NOT evidence of DAW compatibility.
name: ci

on:
  push:
    branches: [main, claude/sleepy-newton-8vp783]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PLUGINVAL_VERSION: v1.0.4        # github.com/Tracktion/pluginval (GPLv3 tool, downloaded, never linked/shipped)
  CLAP_VALIDATOR_VERSION: 0.3.2    # github.com/free-audio/clap-validator
  ART: build/ToneLegionMultiband_artefacts/Release

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - name: macos-arm64
            os: macos-15
            configure: -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64
          - name: windows-x64
            os: windows-2022
            configure: -G "Visual Studio 17 2022" -A x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false   # nothing pushes from CI; also keeps post-job logs short

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libfreetype-dev libfontconfig1-dev libx11-dev libxext-dev xvfb

      - name: Toolchain versions
        run: |
          cmake --version | head -1
          git submodule status --recursive

      - name: Configure
        run: cmake -S . -B build ${{ matrix.configure }}

      - name: Build (all targets)
        run: cmake --build build --config Release --parallel 4

      - name: Unit and DSP tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: List plugin bundles
        run: ls -la "$ART"/*/ || true

      - name: pluginval VST3 (strictness 10)
        run: |
          case "$RUNNER_OS" in
            Linux)   asset=pluginval_Linux.zip;   sha=c01c49d8063965c4c2dea8324468336768f5c9139e0b1caebde14c2400b55352; exe=./pluginval; run="xvfb-run -a" ;;
            macOS)   asset=pluginval_macOS.zip;   sha=3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f; exe=./pluginval.app/Contents/MacOS/pluginval; run="" ;;
            Windows) asset=pluginval_Windows.zip; sha=c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab; exe=./pluginval.exe; run="" ;;
          esac
          curl -sSfL -o pv.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${asset}"
          bash .github/scripts/verify_sha256.sh pv.zip "$sha"
          unzip -q pv.zip
          $run $exe --strictness-level 10 --validate-in-process --output-dir pluginval-logs "$ART/VST3/Tone Legion Multiband.vst3"

      - name: auval AU
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ART/AU/Tone Legion Multiband.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i "tone legion" || true
          auval -strict -v aufx Tlmb Tlgn

      - name: clap-validator CLAP
        run: |
          case "$RUNNER_OS" in
            Linux)   asset=clap-validator-${CLAP_VALIDATOR_VERSION}-ubuntu-18.04.tar.gz;   sha=1476ed68f5657e76050e0c4f19790c02d819ecc62c35fd465059d21f05169cb1 ;;
            macOS)   asset=clap-validator-${CLAP_VALIDATOR_VERSION}-macos-universal.tar.gz; sha=3750f3729adfd8489f2b29019f7f2ed65ba71bf9d5049735f6a2ca0fccb18ffd ;;
            Windows) asset=clap-validator-${CLAP_VALIDATOR_VERSION}-windows.zip;           sha=68cdbe51c05489542b5420a870b7159b4cb352b5ce5c486f9bd8a9b49b75bdda ;;
          esac
          mkdir cv && cd cv
          curl -sSfL -o "$asset" "https://github.com/free-audio/clap-validator/releases/download/${CLAP_VALIDATOR_VERSION}/${asset}"
          bash "$GITHUB_WORKSPACE/.github/scripts/verify_sha256.sh" "$asset" "$sha"
          case "$asset" in *.zip) unzip -q "$asset" ;; *) tar xzf "$asset" ;; esac
          exe=$(find . -type f \( -name clap-validator -o -name clap-validator.exe \) | head -1)
          chmod +x "$exe"
          # On a failed state test, show where the two saved states differ (the files stay on the runner otherwise).
          "$exe" validate "$GITHUB_WORKSPACE/$ART/CLAP/Tone Legion Multiband.clap" || {
            for d in "${TMPDIR:-/tmp}"/clap-validator/*/state-*/; do
              [ -f "$d/state-expected" ] && [ -f "$d/state-actual" ] || continue
              echo "== $(basename "$d")"
              diff <(strings "$d/state-expected" | tr '>' '\n') <(strings "$d/state-actual" | tr '>' '\n') | head -20 || true
            done
            exit 1
          }

      # Beta installer (macOS). pkgbuild / productbuild ship with Xcode's command line tools on the runner.
      - name: Build beta pkg (macOS)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build-pkg.sh "$GITHUB_WORKSPACE/$ART" "$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)"

      - name: pkg smoke test (install, uninstall, AU only)
        if: runner.os == 'macOS'
        run: bash packaging/macos/smoke-test-pkg.sh build/installer/*.pkg

      - name: Upload beta pkg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ToneLegionMultiband-beta-macos-arm64-pkg
          path: build/installer/*.pkg
          if-no-files-found: error
          retention-days: 30

      # Beta installer (Windows only). Inno Setup 6 is normally preinstalled on the windows runner image;
      # install it from Chocolatey only if it is missing.
      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          Get-Item "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" | Select-Object -ExpandProperty VersionInfo | Select-Object ProductVersion

      - name: Build beta installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/build-installer.ps1 -ArtefactDir "${{ github.workspace }}\build\ToneLegionMultiband_artefacts\Release" -Build "$("${{ github.event.pull_request.head.sha || github.sha }}".Substring(0,7))"

      - name: Installer smoke test (install, uninstall, CLAP only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/smoke-test-installer.ps1 -Setup (Get-Item build/installer/*.exe | Select-Object -First 1).FullName

      - name: Upload beta installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ToneLegionMultiband-beta-windows-x64-setup
          path: build/installer/*.exe
          if-no-files-found: error
          retention-days: 30

  # Tests only, under AddressSanitizer + UndefinedBehaviorSanitizer. Evidence, not proof, of memory safety.
  sanitizers:
    name: linux-x64-asan-ubsan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libfreetype-dev libfontconfig1-dev libx11-dev libxext-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTL_ENABLE_ASAN_UBSAN=ON -DTL_BUILD_CLAP=OFF
      - name: Build tests
        run: cmake --build build --target tl_tests --parallel 4
      - name: Tests under ASan + UBSan
        run: ctest --test-dir build --output-on-failure
